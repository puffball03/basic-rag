name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PyPI's Linux torch wheel pulls several GB of CUDA libraries the tests never use.
      # Installing the CPU build first satisfies requirements.txt's torch==2.15.0 pin
      # (2.15.0+cpu matches it), so the next step doesn't download torch again.
      - name: Install CPU-only torch
        run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The embedding model and cross-encoder download from Hugging Face on first use.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2-ms-marco-MiniLM-L-6-v2

      # Unit tests and retrieval-recall evals always run. Answer-accuracy evals call the
      # Foundry LLM: they run when the FOUNDRY_* repository secrets are set and skip otherwise.
      - name: Run tests and evaluation harness
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_DEPLOYMENT: ${{ secrets.FOUNDRY_DEPLOYMENT }}
        run: pytest -rs
